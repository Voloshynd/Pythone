<!DOCTYPE html>
<html class="page" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>
    <title>System accountant</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/reset.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://unpkg.com/spectre.css/dist/spectre.min.css">
    <link rel="stylesheet"
          href="https://unpkg.com/spectre.css/dist/spectre-exp.min.css">
    <link rel="stylesheet"
          href="https://unpkg.com/spectre.css/dist/spectre-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body class="page-body">
<header class="navbar">
    <section class="navbar-section">
        <div class="navbar-logo">
            <a class="navbar-logo__link btn btn-link" href="/">
                <i class="fa-solid fa-warehouse"></i>
                Magazyn i księgowość
            </a>
        </div>
    </section>

    <div class="dropdown">
        <a href="#" class="btn btn-link dropdown-toggle" tabindex="0">
            <i class="fa-solid fa-bars"></i> <i class="icon icon-caret"></i>
        </a>
        <ul class="menu">
            <li class="divider" data-content="MENU">
            </li>
            <li class="menu-item">
                <a href="/">
                    <i class="icon icon-link"></i> Strona główna
                </a>
            </li>

            <li class="menu-item">
                <a href="/history/">
                    <i class="icon icon-link"></i> Historia
                </a>
            </li>
        </ul>
    </div>

    <section class="navbar-section">
        <a class="navbar-section__link btn btn-link" href="/">
            <i class="fa-solid fa-house"></i> Strona główna
        </a>
        <a class="navbar-section__link btn btn-link" href="/history/">
            <i class="fa-solid fa-clock-rotate-left"></i> Historia
        </a>
    </section>
</header>

<main class="main">
    <div class="main-wrapper">
        {% block content %}

        {% endblock %}
    </div>
</main>
</body>
</html>
